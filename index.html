<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>刘海泉的导航站</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f4f6fb;--card:#fff;--text:#1f2430;--sub:#8a93a6;--accent:#3b82f6}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.wrap{max-width:1100px;margin:0 auto;padding:28px 18px 60px}
header{text-align:center;margin:26px 0 22px}
header h1{font-size:30px;font-weight:700;letter-spacing:2px}
header p{color:var(--sub);font-size:13px;margin-top:8px}
/* 搜索 */
.search{display:flex;max-width:560px;margin:0 auto 8px;background:var(--card);border-radius:14px;box-shadow:0 2px 12px rgba(30,60,120,.08);overflow:hidden}
.search select{border:0;background:transparent;padding:0 8px 0 14px;font-size:14px;color:var(--sub);outline:none;cursor:pointer}
.search input{flex:1;border:0;padding:15px 10px;font-size:15px;outline:none;background:transparent}
.search button{border:0;background:var(--accent);color:#fff;padding:0 26px;font-size:15px;cursor:pointer}
/* 分组 */
.group{margin-top:30px}
.group h2{font-size:17px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.group h2 .count{font-size:12px;color:var(--sub);font-weight:400}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.card{display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:20px 10px 16px;text-decoration:none;color:var(--text);box-shadow:0 2px 10px rgba(30,60,120,.06);transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(30,60,120,.12)}
.icon{width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:#fff}
.card span.name{font-size:14px}
.card span.desc{font-size:11px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
footer{text-align:center;color:var(--sub);font-size:12px;margin-top:44px}
@media(max-width:520px){.grid{grid-template-columns:repeat(3,1fr)}.card span.desc{display:none}}
</style>
</head>
<body>
<div class="wrap">
<header>

<p>常用网址 · 一键直达</p>

<form class="search" onsubmit="return goSearch(event)">
<select id="engine">
<option value="https://cn.bing.com/search?q=" selected>必应</option>
<option value="https://www.baidu.com/s?wd=">百度</option>
<option value="https://www.google.com/search?q=">谷歌</option>
</select>
<input id="q" placeholder="请输入搜索内容" autocomplete="off">
<button type="submit">搜索</button>
</form>

<div class="group">
<h2>⭐ 常用 <span class="count">10</span></h2>
<div class="grid" id="g0"></div>
</div>

<div class="group">

<footer>©2026 刘海泉的导航站</footer>
</div>

function iconStyle(name){var h=0;for(var i=0;i<name.length;i++)h=(h*31+name.charCodeAt(i))>>>0;return colors[h%colors.length];}
function card(s){var c=iconStyle(s.title);return '<a class="card" href="'+s.url+'" target="_blank" rel="noopener"><div class="icon" style="background:'+c+'">'+s.title.charAt(0)+'</div><span class="name">'+s.title+'</span>'+(s.desc?'<span class="desc">'+s.desc+'</span>':'')+'</a>';}
