<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>万年历 · 黄历</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f4f1ea;--card:#fffdf8;--text:#2b2620;--sub:#8a8272;--red:#c0392b;--gold:#b8860b;--green:#1e7e34;--shadow:rgba(120,90,40,.10)}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",serif;background:var(--bg);color:var(--text);min-height:100vh}
.wrap{max-width:720px;margin:0 auto;padding:18px 14px 60px}
a.back{display:inline-block;margin-bottom:10px;color:var(--sub);text-decoration:none;font-size:14px}
/* 今日卡 */
.today{background:var(--card);border-radius:18px;padding:22px 20px;box-shadow:0 3px 14px var(--shadow);border-top:4px solid var(--red);text-align:center}
.today .solar{font-size:15px;color:var(--sub)}
.today .big{font-size:52px;font-weight:800;margin:6px 0;line-height:1}
.today .lunar{font-size:16px;margin-top:4px}
.today .ganzhi{font-size:13px;color:var(--sub);margin-top:8px}
.yiji{display:flex;gap:10px;margin-top:16px;text-align:left}
.yiji>div{flex:1;background:var(--bg);border-radius:12px;padding:12px}
.yiji h4{font-size:14px;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.yi h4{color:var(--green)} .ji h4{color:var(--red)}
.yiji span{display:inline-block;font-size:13px;background:var(--card);border-radius:8px;padding:4px 9px;margin:0 6px 6px 0;box-shadow:0 1px 3px var(--shadow)}
/* 分组标题 */
.sec{margin-top:26px}
.sec h2{font-size:17px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.sec h2::before{content:"";width:4px;height:18px;background:var(--red);border-radius:2px}
/* 日历 */
.cal{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 3px 14px var(--shadow)}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head b{font-size:17px}
.cal-head button{border:0;background:var(--bg);border-radius:10px;width:36px;height:36px;font-size:18px;cursor:pointer;color:var(--text)}
.week{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12px;color:var(--sub);margin-bottom:6px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{border-radius:10px;padding:7px 2px;text-align:center;cursor:pointer;min-height:56px}
.day:hover{background:var(--bg)}
.day .s{font-size:15px;font-weight:600}
.day .l{font-size:10px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden}
.day .l.fest{color:var(--red);font-weight:700}
.day.today{background:var(--red);color:#fff}
.day.today .l{color:#ffdbd4}
.day.today .l.fest{color:#fff}
.day.sel{outline:2px solid var(--red);outline-offset:-2px}
.day.other{opacity:.28}
/* 选中日详情 */
.detail{background:var(--card);border-radius:18px;padding:18px;margin-top:12px;box-shadow:0 3px 14px var(--shadow);display:none}
.detail.show{display:block}
.detail h3{font-size:16px;margin-bottom:10px}
.detail .row{font-size:14px;margin:6px 0;color:var(--text)}
.detail .row b{color:var(--sub);font-weight:400;margin-right:8px}
/* 倒数日 */
.count{background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:10px;box-shadow:0 2px 8px var(--shadow);display:flex;align-items:center;justify-content:space-between}
.count .n{font-size:15px;font-weight:600}
.count .d{font-size:12px;color:var(--sub);margin-top:3px}
.count .left{font-size:22px;font-weight:800;color:var(--red)}
.count .left small{font-size:12px;font-weight:400;color:var(--sub)}
/* 历史 */
.hist{background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:10px;box-shadow:0 2px 8px var(--shadow);font-size:14px;line-height:1.7}
.hist b{color:var(--red);margin-right:8px}
footer{text-align:center;color:var(--sub);font-size:12px;margin-top:36px}
@media (prefers-color-scheme:dark){
:root{--bg:#1a1712;--card:#242019;--text:#e8e0d0;--sub:#9a8f78;--shadow:rgba(0,0,0,.4)}
.yiji span{background:#2e2820}
.cal-head button{background:#2e2820}
}
</style>
</head>
<body>
<div class="wrap">
<a class="back" href="../index.html">‹ 返回导航站</a>

<div class="today" id="todayCard"></div>

<div class="sec">
<h2>📅 日历</h2>
<div class="cal">
<div class="cal-head">
<button id="prevM">‹</button><b id="calTitle"></b><button id="nextM">›</button>
</div>
<div class="week"><span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span></div>
<div class="days" id="days"></div>
</div>
<div class="detail" id="detail"></div>
</div>

<div class="sec">
<h2>⏳ 节日倒数</h2>
<div id="counts"></div>
</div>

<div class="sec">
<h2>📜 历史上的今天</h2>
<div id="history"></div>
</div>

<footer>万年历 · 数据为传统历法推算，仅供参考</footer>
</div>
<script src="lunar.js"></script>
<script>
var WEEK=['周日','周一','周二','周三','周四','周五','周六'];
function S(y,m,d){return Solar.fromYmd(y,m,d);}
function pad(n){return (n<10?'0':'')+n;}
var now=new Date();
var viewY=now.getFullYear(), viewM=now.getMonth()+1;
var selKey=null;

/* ===== 今日卡 ===== */
(function(){
var s=S(now.getFullYear(),now.getMonth()+1,now.getDate());
var l=s.getLunar();
var yi=l.getDayYi().slice(0,8), ji=l.getDayJi().slice(0,8);
document.getElementById('todayCard').innerHTML=
'<div class="solar">'+s.getYear()+'年'+s.getMonth()+'月'+s.getDay()+'日 '+WEEK[s.getWeek()]+'</div>'+
'<div class="big">'+s.getDay()+'</div>'+
'<div class="lunar">农历'+l.getMonthInChinese()+'月'+l.getDayInChinese()+(l.getFestivals().length?' · '+l.getFestivals().join(' '):'')+'</div>'+
'<div class="ganzhi">'+l.getYearInGanZhi()+'年('+l.getYearShengXiao()+') · '+l.getMonthInGanZhi()+'月 · '+l.getDayInGanZhi()+'日 · 冲'+l.getDayChongShengXiao()+'</div>'+
'<div class="yiji"><div class="yi"><h4>✅ 宜</h4>'+yi.map(function(x){return '<span>'+x+'</span>'}).join('')+'</div>'+
'<div class="ji"><h4>❌ 忌</h4>'+ji.map(function(x){return '<span>'+x+'</span>'}).join('')+'</div></div>';
})();

/* ===== 日历 ===== */
function renderCal(){
var first=new Date(viewY,viewM-1,1).getDay();
var dim=new Date(viewY,viewM,0).getDate();
var prevDim=new Date(viewY,viewM-1,0).getDate();
document.getElementById('calTitle').textContent=viewY+'年'+viewM+'月';
var html='', i, d, key;
for(i=first-1;i>=0;i--){d=prevDim-i;html+=dayCell(viewY,viewM-1,d,true);}
for(d=1;d<=dim;d++){html+=dayCell(viewY,viewM,d,false);}
var tail=(7-(first+dim)%7)%7;
for(d=1;d<=tail;d++){html+=dayCell(viewY,viewM+1,d,true);}
document.getElementById('days').innerHTML=html;
}
function dayCell(y,m,d,other){
var mm=((m-1+12)%12)+1, yy=y+(m<1?-1:(m>12?1:0));
var s=S(yy,mm,d), l=s.getLunar();
var fest=l.getFestivals().concat(l.getOtherFestivals());
var jq=l.getJieQi();
var label=fest.length?fest[0]:(jq?jq:(l.getDay()==1?l.getMonthInChinese()+'月':l.getDayInChinese()));
var key=yy+'-'+pad(mm)+'-'+pad(d);
var cls='day'+(other?' other':'');
var t=new Date();
if(yy===t.getFullYear()&&mm===t.getMonth()+1&&d===t.getDate())cls+=' today';
if(key===selKey)cls+=' sel';
return '<div class="'+cls+'" data-k="'+key+'"><div class="s">'+d+'</div><div class="l'+(fest.length||jq?' fest':'')+'">'+label+'</div></div>';
}
document.getElementById('days').addEventListener('click',function(e){
var el=e.target.closest('.day');if(!el)return;
selKey=el.getAttribute('data-k');
renderCal();showDetail(selKey);
});
document.getElementById('prevM').onclick=function(){viewM--;if(viewM<1){viewM=12;viewY--;}renderCal();};
document.getElementById('nextM').onclick=function(){viewM++;if(viewM>12){viewM=1;viewY++;}renderCal();};

function showDetail(key){
var p=key.split('-'), s=S(+p[0],+p[1],+p[2]), l=s.getLunar();
var fest=l.getFestivals().concat(l.getOtherFestivals());
var el=document.getElementById('detail');
el.className='detail show';
el.innerHTML='<h3>'+p[0]+'年'+(+p[1])+'月'+(+p[2])+'日 '+WEEK[s.getWeek()]+(fest.length?' · '+fest.join(' '):'')+'</h3>'+
'<div class="row"><b>农历</b>'+l.getYearInChinese()+'年'+l.getMonthInChinese()+'月'+l.getDayInChinese()+(l.isLeapMonth()?'（闰月）':'')+'</div>'+
'<div class="row"><b>干支</b>'+l.getYearInGanZhi()+'年 '+l.getMonthInGanZhi()+'月 '+l.getDayInGanZhi()+'日</div>'+
'<div class="row"><b>生肖</b>'+l.getYearShengXiao()+' · 冲'+l.getDayChongShengXiao()+'</div>'+
'<div class="row"><b>彭祖</b>'+l.getPengZuGan()+' '+l.getPengZuZhi()+'</div>'+
'<div class="row"><b>宜</b>'+l.getDayYi().join('、')+'</div>'+
'<div class="row"><b>忌</b>'+l.getDayJi().join('、')+'</div>';
renderHistory(+p[1],+p[2]);
}

/* ===== 节日倒数 ===== */
var FESTS=[
{n:'元旦',t:'s',m:1,d:1},
{n:'春节',t:'l',m:1,d:1},
{n:'元宵节',t:'l',m:1,d:15},
{n:'清明节',t:'q',q:'清明'},
{n:'劳动节',t:'s',m:5,d:1},
{n:'端午节',t:'l',m:5,d:5},
{n:'中秋节',t:'l',m:8,d:15},
{n:'国庆节',t:'s',m:10,d:1}
];
function nextFest(f){
var y=now.getFullYear();
for(var k=0;k<2;k++){
var dt=null;
if(f.t==='s'){dt=new Date(y+k,f.m-1,f.d);}
else if(f.t==='l'){var l=Lunar.fromYmd(y+k,f.m,f.d);var s=l.getSolar();dt=new Date(s.getYear(),s.getMonth()-1,s.getDay());}
else{var tab=Lunar.fromYmd(y+k,1,1).getJieQiTable();var js=tab[f.q];if(js){dt=new Date(js.getYear(),js.getMonth()-1,js.getDay());}}
if(dt){var today=new Date(now.getFullYear(),now.getMonth(),now.getDate());if(dt>=today)return {date:dt,name:f.n};}
}
return null;
}
(function(){
var items=FESTS.map(nextFest).filter(Boolean);
items.sort(function(a,b){return a.date-b.date;});
document.getElementById('counts').innerHTML=items.map(function(it){
var diff=Math.round((it.date-new Date(now.getFullYear(),now.getMonth(),now.getDate()))/86400000);
return '<div class="count"><div><div class="n">'+it.name+'</div><div class="d">'+it.date.getFullYear()+'年'+(it.date.getMonth()+1)+'月'+it.date.getDate()+'日</div></div><div class="left">'+(diff===0?'今天':diff+'<small> 天</small>')+'</div></div>';
}).join('');
})();

/* ===== 历史上的今天 ===== */
var HISTORY={};
fetch('history.json').then(function(r){return r.json();}).then(function(j){HISTORY=j;renderHistory(now.getMonth()+1,now.getDate());}).catch(function(){});
function renderHistory(m,d){
var key=pad(m)+pad(d), arr=HISTORY[key]||[];
document.getElementById('history').innerHTML=arr.length?arr.map(function(t){
var p=t.split('——');return '<div class="hist"><b>'+(p[0]||'')+'</b>'+(p[1]||t)+'</div>';
}).join(''):'<div class="hist">暂无数据</div>';
}

renderCal();
</script>
</body>
</html>
